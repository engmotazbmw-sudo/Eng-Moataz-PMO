<title>مكتب إدارة المشاريع PMO – رابط غير صالح</title>
<style>
html,body{margin:0;min-height:100%}
body{font-family:"Cairo",Tahoma,system-ui,sans-serif;color:#F7F3E9;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
  background:radial-gradient(1000px 600px at 50% 25%,#0d6b52 0%,#00382E 55%,#012219 100%);text-align:center}

.ic{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;border:2px solid #E4C27D;color:#E4C27D}
.ic svg{width:40px;height:40px}

p{margin:0;color:#cfe0da;line-height:1.9;font-size:15.5px}
small{display:block;margin-top:26px;color:#E4C27D;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></div>
  <h1>هذا الرابط لم يعد صالحاً</h1>
  <p>رمز QR الذي استخدمته قديم وتم إيقافه.<br>يُرجى استخدام رمز QR الجديد المعتمد للتقرير.</p>
  <small>مكتب إدارة المشاريع PMO · أمانة منطقة حائل</small>
</div>
