html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:"Cairo",Tahoma,system-ui,sans-serif;color:#F7F3E9;

a.card:hover,a.card:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.1);border-color:#E4C27D;outline:none}
.ic{flex:0 0 64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#E4C27D,#A9853F);color:#00382E}
.ic svg{width:34px;height:34px}

a.card em{display:block;font-style:normal;color:#cfe0da;font-size:13.5px;margin-top:4px;line-height:1.6}
footer{margin-top:30px;color:#9fbdb3;font-size:12.5px;position:relative;text-align:center}
